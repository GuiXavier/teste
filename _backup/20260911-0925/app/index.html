<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>IPTV</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/tv.css">
</head>
<body>

<div id="app">

  <div class="topbar">
    <div class="brand">IPTV <b>TV</b></div>
    <div style="font-size:var(--fs-xs);color:var(--color-text-muted);line-height:1.6">
      <div id="device">detectando aparelho...</div>
      <div><span id="net">rede...</span> &middot; <span id="storage">armazenamento...</span></div>
    </div>
    <div id="status" class="topbar-status"><span class="dot"></span>iniciando</div>
  </div>

  <div class="body">

    <div class="sidebar">
      <div class="cat-strip" id="cats"></div>
      <div class="channels" id="channels"></div>
    </div>

    <div class="stage">
      <div class="video-wrap">
        <video id="video" playsinline></video>
        <div id="overlay" class="stage-overlay"></div>
      </div>
      <div class="now">
        <div class="now-title" id="nowTitle">nenhum canal</div>
        <div class="now-meta" id="nowMeta"></div>
      </div>
    </div>

  </div>

  <div class="keybar">
    <span class="grp"><span class="k">&#9650;</span><span class="k">&#9660;</span> canal</span>
    <span class="grp"><span class="k">&#9668;</span><span class="k">&#9658;</span> categoria</span>
    <span class="grp"><span class="k">OK</span> assistir</span>
    <span class="grp"><span class="k">CH+/-</span> zapear</span>
    <span class="grp"><span class="k">&#9632;</span> parar</span>
    <span class="grp"><span class="k k--red">V</span> recarregar canal</span>
    <span class="grp"><span class="k k--green">V</span> TV / Filmes / Series</span>
    <span class="grp"><span class="k k--blue">A</span> configuracao</span>
    <span class="grp"><span class="k k--yellow">A</span> log na tela</span>
  </div>

</div>

<script src="hls.min.js"></script>
<script src="js/platform/keys.js"></script>
<script src="js/platform/Log.js"></script>
<script src="js/platform/luna.js"></script>
<script src="js/platform/store.js"></script>
<script src="js/player/Player.js"></script>
<script src="js/player/HealthMonitor.js"></script>
<script src="js/nav/Spatial.js"></script>
<script src="js/ui/ChannelList.js"></script>
<script src="js/ui/Settings.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
